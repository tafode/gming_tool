[package]
name = "gming_tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform TTRPG Game Master session tool"
license = "MIT"

[dependencies]
directories = "6"
eframe = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = "0.36"
